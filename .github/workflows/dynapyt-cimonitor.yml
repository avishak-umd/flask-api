# DyPyBench #3 (flask-api) — run the same test command under DynaPyt and
# CIMonitor, upload each tool's logs as workflow artifacts for manual analysis.

name: DynaPyt vs CIMonitor

on: [push, workflow_dispatch]

jobs:
  dynapyt:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-timeout

      - name: Setup DynaPyt
        uses: avishak-umd/seytup-dynapyt@master
        with:
          targets: |
            file:flask_api/app.py
            file:flask_api/compat.py
            file:flask_api/decorators.py
            file:flask_api/exceptions.py
            file:flask_api/helpers.py
            file:flask_api/mediatypes.py
            file:flask_api/negotiation.py
            file:flask_api/parsers.py
            file:flask_api/renderers.py
            file:flask_api/request.py
            file:flask_api/response.py
            file:flask_api/settings.py
            file:flask_api/status.py
          analysis: "dynapyt.analyses.CallGraph.CallGraph"

      - name: Run test suite
        timeout-minutes: 350
        run: |
          timeout -s INT -k 20m 325m pytest --timeout=300 --import-mode=importlib flask_api/tests 2>&1 | tee pytest-output.log || true

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-log-flask-api-dynapyt
          path: pytest-output.log

      - name: Collect & upload DynaPyt traces
        if: always()
        uses: avishak-umd/seytup-dynapyt@master
        with:
          mode: collect
          artifact-name: dynapyt-flask-api-${{ github.run_id }}

  cimonitor:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-timeout

      - uses: JavidDitty/setup-cintent@main
        with:
          profiler: "setprofile"

      - name: Run test suite
        timeout-minutes: 350
        run: |
          timeout -s INT -k 20m 325m pytest --timeout=300 --import-mode=importlib flask_api/tests 2>&1 | tee pytest-output.log || true

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-log-flask-api-cimonitor
          path: pytest-output.log

      - name: Upload CIntent Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.CINTENT_ARTIFACT_NAME }}
          path: ${{ env.CINTENT_LOGS }}
